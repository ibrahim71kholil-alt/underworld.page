<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Underworld - Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #f4efe6; color: #2b221e; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h2, h3 { color: #2b221e; margin-bottom: 15px; }
    .card { background: #fff; border: 1px solid #e0d6cc; padding: 25px; border-radius: 8px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
    input, select, textarea, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #d4c5b9; background: #faf8f5; color: #2b221e; font-size: 15px; }
    textarea { resize: vertical; height: 90px; }
    input:focus, select:focus, textarea:focus { outline: 2px solid #2b221e; }
    button { background: #2b221e; color: #fff; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; }
    button:hover { background: #55443d; }
    .logout-btn { background: #c25e38; color: #fff; margin-bottom: 20px; width: auto; padding: 8px 18px; float: right; }
    .logout-btn:hover { background: #a04928; }
    .product-row { display: flex; justify-content: space-between; align-items: center; background: #faf8f5; padding: 12px; margin-bottom: 10px; border-radius: 6px; border-left: 4px solid #2b221e; }
    .del-btn { width: auto; background: #c25e38; color: #fff; padding: 6px 14px; margin: 0; font-size: 13px; }
    .del-btn:hover { background: #a04928; }
    #loginSection, #dashboardSection { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Login Screen -->
    <div id="loginSection" class="card">
      <h2>Underworld Admin Login</h2>
      <input type="email" id="loginEmail" placeholder="Admin Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button id="loginBtn">Login</button>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboardSection">
      <button class="logout-btn" id="logoutBtn">Logout</button>
      <div style="clear: both;"></div>

      <div class="card">
        <h3>➕ Add New Product</h3>
        <form id="addProductForm">
          <input type="text" id="pName" placeholder="Product Name" required>
          <div style="display: flex; gap: 10px;">
            <input type="number" id="pPrice" placeholder="Regular Price (৳)" required>
            <input type="number" id="pOldPrice" placeholder="Old Price / Discount Price (Optional)">
          </div>
          <div style="display: flex; gap: 10px;">
            <select id="pCategory" required>
              <option value="men">Men's Fashion</option>
              <option value="women">Women's Fashion</option>
              <option value="sports">Sports</option>
            </select>
            <select id="pStock" required>
              <option value="in">In Stock</option>
              <option value="out">Stock Out</option>
            </select>
          </div>
          <input type="text" id="pSizes" placeholder="Sizes (e.g. S, M, L, XL or Free Size)">
          <textarea id="pDesc" placeholder="Product Description & Details"></textarea>
          <input type="text" id="pImageUrls" placeholder="Multiple Image URLs (comma separated: url1, url2, url3)" required>
          <button type="submit">Publish Product</button>
        </form>
      </div>

      <div class="card">
        <h3>📦 Product List</h3>
        <div id="productList">Loading data...</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAYuV3giwq0k0P-LJi-o5C5wnmbTHxwfYw",
      authDomain: "underworld-f7aae.firebaseapp.com",
      projectId: "underworld-f7aae",
      storageBucket: "underworld-f7aae.firebasestorage.app",
      messagingSenderId: "1054711880818",
      appId: "1:1054711880818:web:73a97b6fc1413e3b4ab6eb"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("dashboardSection").style.display = "block";
        loadProducts();
      } else {
        document.getElementById("loginSection").style.display = "block";
        document.getElementById("dashboardSection").style.display = "none";
      }
    });

    document.getElementById("loginBtn").addEventListener("click", () => {
      const email = document.getElementById("loginEmail").value;
      const pass = document.getElementById("loginPassword").value;
      signInWithEmailAndPassword(auth, email, pass)
        .catch(err => alert("Login Error: " + err.message));
    });

    document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth));

    document.getElementById("addProductForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await addDoc(collection(db, "products"), {
          name: document.getElementById("pName").value,
          price: Number(document.getElementById("pPrice").value),
          oldPrice: document.getElementById("pOldPrice").value ? Number(document.getElementById("pOldPrice").value) : null,
          category: document.getElementById("pCategory").value,
          stock: document.getElementById("pStock").value,
          sizes: document.getElementById("pSizes").value,
          description: document.getElementById("pDesc").value,
          imageUrls: document.getElementById("pImageUrls").value,
          createdAt: serverTimestamp()
        });
        alert("Product added successfully!");
        document.getElementById("addProductForm").reset();
        loadProducts();
      } catch (err) {
        alert("Error: " + err.message);
      }
    });

    async function loadProducts() {
      const list = document.getElementById("productList");
      list.innerHTML = "Loading...";
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        list.innerHTML = "";
        if (querySnapshot.empty) {
          list.innerHTML = "<p>No products found.</p>";
          return;
        }
        querySnapshot.forEach((d) => {
          const item = d.data();
          const row = document.createElement("div");
          row.className = "product-row";
          row.innerHTML = `
            <div>
              <strong>${item.name}</strong> - ৳${item.price} <br>
              <small style="color: #666;">Category: ${item.category} | Stock: ${item.stock}</small>
            </div>
            <button class="del-btn" onclick="removeProduct('${d.id}')">Delete</button>
          `;
          list.appendChild(row);
        });
      } catch (err) {
        list.innerHTML = "Error: " + err.message;
      }
    }

    window.removeProduct = async (id) => {
      if (confirm("Are you sure you want to delete this product?")) {
        await deleteDoc(doc(db, "products", id));
        loadProducts();
      }
    };
  </script>
</body>
</html>
