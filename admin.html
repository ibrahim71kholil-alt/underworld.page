<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>UNDERWORLD ADMIN</title>

  <link rel="stylesheet" href="admin.css">

</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="login-screen">

  <div class="login-box">

    <div class="admin-logo">
      ◈ UNDERWORLD
    </div>

    <p>ADMIN CONTROL PANEL</p>

    <input
      id="loginEmail"
      type="email"
      placeholder="Admin email"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
    >

    <button id="loginBtn">
      LOGIN
    </button>

    <div id="loginError"></div>

  </div>

</div>


<!-- ADMIN APP -->

<div id="adminApp" class="admin-app hidden">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-logo">
      ◈ UNDERWORLD
      <small>ADMIN</small>
    </div>

    <button class="nav-btn active" data-section="dashboard">
      Dashboard
    </button>

    <button class="nav-btn" data-section="products">
      Products
    </button>

    <button class="nav-btn" data-section="categories">
      Categories
    </button>

    <button class="nav-btn" data-section="orders">
      Orders
    </button>

    <button id="logoutBtn" class="logout">
      Logout
    </button>

  </aside>


  <!-- MAIN -->

  <main class="admin-main">

    <header class="admin-header">

      <div>
        <span>UNDERWORLD ADMIN</span>
        <h1 id="pageTitle">Dashboard</h1>
      </div>

      <div class="admin-user">
        ● ADMIN
      </div>

    </header>


    <!-- DASHBOARD -->

    <section id="dashboardSection" class="admin-section">

      <div class="stats-grid">

        <div class="stat">
          <span>Total Products</span>
          <strong id="totalProducts">0</strong>
        </div>

        <div class="stat">
          <span>Total Orders</span>
          <strong id="totalOrders">0</strong>
        </div>

        <div class="stat">
          <span>Pending Orders</span>
          <strong id="pendingOrders">0</strong>
        </div>

        <div class="stat">
          <span>Total Revenue</span>
          <strong id="totalRevenue">৳0</strong>
        </div>

      </div>

      <div class="panel">

        <div class="panel-header">
          <h2>Recent Orders</h2>
        </div>

        <div id="recentOrders"></div>

      </div>

    </section>


    <!-- PRODUCTS -->

    <section
      id="productsSection"
      class="admin-section hidden"
    >

      <div class="section-top">

        <div>
          <span>INVENTORY</span>
          <h2>Products</h2>
        </div>

        <button id="addProductBtn" class="add-btn">
          + ADD PRODUCT
        </button>

      </div>

      <div class="panel">

        <div id="adminProducts"></div>

      </div>

    </section>


    <!-- CATEGORIES -->

    <section
      id="categoriesSection"
      class="admin-section hidden"
    >

      <div class="section-top">

        <div>
          <span>STORE</span>
          <h2>Categories</h2>
        </div>

      </div>

      <div class="category-admin">

        <input
          id="categoryName"
          placeholder="New category name"
        >

        <button id="addCategoryBtn">
          ADD CATEGORY
        </button>

      </div>

      <div id="categoryList"></div>

    </section>


    <!-- ORDERS -->

    <section
      id="ordersSection"
      class="admin-section hidden"
    >

      <div class="section-top">

        <div>
          <span>SALES</span>
          <h2>Orders</h2>
        </div>

      </div>

      <div class="panel">

        <div id="adminOrders"></div>

      </div>

    </section>

  </main>

</div>


<!-- PRODUCT MODAL -->

<div id="productModal" class="admin-modal">

  <div class="admin-modal-box">

    <button class="close-admin-modal" id="closeProductModal">
      ×
    </button>

    <h2 id="productModalTitle">
      Add New Product
    </h2>

    <form id="productForm">

      <input type="hidden" id="productId">

      <div class="form-grid">

        <div>
          <label>Product Name *</label>
          <input id="productName" required>
        </div>

        <div>
          <label>Category *</label>
          <select id="productCategory" required>
            <option value="Men">Men</option>
            <option value="Women">Women</option>
            <option value="Sports">Sports</option>
          </select>
        </div>

        <div>
          <label>Regular Price *</label>
          <input id="productPrice" type="number" required>
        </div>

        <div>
          <label>Discount Price</label>
          <input id="productDiscount" type="number">
        </div>

        <div>
          <label>Stock Quantity *</label>
          <input id="productStock" type="number" required>
        </div>

        <div>
          <label>Sizes</label>
          <input
            id="productSizes"
            placeholder="S, M, L, XL"
          >
        </div>

        <div>
          <label>Colors</label>
          <input
            id="productColors"
            placeholder="Black, White, Red"
          >
        </div>

        <div>
          <label>Tags</label>
          <input
            id="productTags"
            placeholder="Premium, New, Trending"
          >
        </div>

      </div>


      <label>Product Image URLs *</label>

      <textarea
        id="productImages"
        placeholder="One image URL per line"
        required
      ></textarea>


      <label>Description</label>

      <textarea
        id="productDescription"
        placeholder="Product details..."
      ></textarea>


      <label class="check-label">

        <input
          id="productPopular"
          type="checkbox"
        >

        Show in Popular Products

      </label>


      <button
        type="submit"
        class="create-btn"
      >
        SAVE PRODUCT
      </button>

    </form>

  </div>

</div>


<script type="module" src="admin.js"></script>

</body>
</html>
